{% extends 'shared/base.html' %}

{% block title %}Delete Workout Log - Stay Active{% endblock %}

{% block content %}
<h2>Confirm Deletion</h2>
<p>Are you sure you want to delete this activity log for <strong>{{ activity.participant.full_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'activities:list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
