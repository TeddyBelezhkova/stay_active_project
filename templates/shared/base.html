{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stay Active{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.0">
</head>
<body>

    {% include 'shared/header.html' %}
    {% include 'shared/nav.html' %}

    <main class="container content-area">
        {% if messages %}
    <div class="messages-container" style="max-width: 1100px; margin: 15px auto; padding: 0 20px;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; font-weight: 500;
                {% if message.tags == 'success' %}background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% endif %}
                {% if message.tags == 'error' %}background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% endif %}
                {% if message.tags == 'info' %}background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb;{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

        {% block content %}
        {% endblock %}
    </main>

    {% include 'shared/footer.html' %}

</body>
</html>
